openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Dr. Shweta Tripathi Health Reset
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Recipe management
  - name: blogs
    description: Blog post management
  - name: timeslots
    description: Consultation time slot management
  - name: bookings
    description: Consultation booking management
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Recipes ─────────────────────────────────────────────────────────────────

  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List published recipes (public). Pass ?all=true with admin token to list all.
      parameters:
        - in: query
          name: all
          schema: { type: string }
          description: If "true" and authenticated as admin, return unpublished too
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"

    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a recipe (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeInput"
      responses:
        "201":
          description: Created recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          description: Unauthorized

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a single recipe by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recipe detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found

    put:
      operationId: updateRecipe
      tags: [recipes]
      summary: Update a recipe (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipePatch"
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete a recipe (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Blogs ───────────────────────────────────────────────────────────────────

  /blogs:
    get:
      operationId: listBlogs
      tags: [blogs]
      summary: List published blog posts (public). Pass ?all=true with admin token to list all.
      parameters:
        - in: query
          name: all
          schema: { type: string }
          description: If "true" and authenticated as admin, return unpublished too
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

    post:
      operationId: createBlog
      tags: [blogs]
      summary: Create a blog post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogInput"
      responses:
        "201":
          description: Created blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "401":
          description: Unauthorized

  /blogs/{id}:
    get:
      operationId: getBlog
      tags: [blogs]
      summary: Get a single blog post by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Blog post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found

    put:
      operationId: updateBlog
      tags: [blogs]
      summary: Update a blog post (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPatch"
      responses:
        "200":
          description: Updated blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteBlog
      tags: [blogs]
      summary: Delete a blog post (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Time Slots ──────────────────────────────────────────────────────────────

  /timeslots:
    get:
      operationId: listTimeslots
      tags: [timeslots]
      summary: List available (not yet booked) upcoming time slots (public)
      responses:
        "200":
          description: Available time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

    post:
      operationId: createTimeslot
      tags: [timeslots]
      summary: Create a time slot (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSlotInput"
      responses:
        "201":
          description: Created time slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "401":
          description: Unauthorized

  /timeslots/all:
    get:
      operationId: listAllTimeslots
      tags: [timeslots]
      summary: List all time slots including booked ones (admin only)
      responses:
        "200":
          description: All time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"
        "401":
          description: Unauthorized

  /timeslots/{id}:
    patch:
      operationId: updateTimeslot
      tags: [timeslots]
      summary: Update a time slot (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSlotPatch"
      responses:
        "200":
          description: Updated time slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "401":
          description: Unauthorized
        "404":
          description: Not found

    delete:
      operationId: deleteTimeslot
      tags: [timeslots]
      summary: Delete a time slot (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Bookings ────────────────────────────────────────────────────────────────

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all consultation bookings (admin only)
      responses:
        "200":
          description: All bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized

    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a consultation booking (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Validation error or slot already taken
        "404":
          description: Time slot not found

  /bookings/{id}:
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete / cancel a booking (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Admin ───────────────────────────────────────────────────────────────────

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login – returns a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Invalid password

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: High-level dashboard statistics (admin only)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    # ── Recipe schemas ────────────────────────────────────────────────────────

    Recipe:
      type: object
      required: [id, title, summary, content, published, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: ["string", "null"] }
        ingredients:
          type: array
          items: { type: string }
        prepTime: { type: ["string", "null"] }
        cookTime: { type: ["string", "null"] }
        servings: { type: ["integer", "null"] }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }

    RecipeInput:
      type: object
      required: [title, summary, content]
      properties:
        title: { type: string, minLength: 1 }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        ingredients:
          type: array
          items: { type: string }
        prepTime: { type: string }
        cookTime: { type: string }
        servings: { type: integer }
        published: { type: boolean }

    RecipePatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: ["string", "null"] }
        ingredients:
          type: array
          items: { type: string }
        prepTime: { type: ["string", "null"] }
        cookTime: { type: ["string", "null"] }
        servings: { type: ["integer", "null"] }
        published: { type: boolean }

    # ── Blog schemas ──────────────────────────────────────────────────────────

    BlogPost:
      type: object
      required: [id, title, summary, content, author, published, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: ["string", "null"] }
        author: { type: string }
        tags:
          type: array
          items: { type: string }
        published: { type: boolean }
        createdAt: { type: string, format: date-time }

    BlogInput:
      type: object
      required: [title, summary, content, author]
      properties:
        title: { type: string, minLength: 1 }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: string }
        author: { type: string }
        tags:
          type: array
          items: { type: string }
        published: { type: boolean }

    BlogPatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        summary: { type: string }
        content: { type: string }
        imageUrl: { type: ["string", "null"] }
        author: { type: string }
        tags:
          type: array
          items: { type: string }
        published: { type: boolean }

    # ── Time-slot schemas ─────────────────────────────────────────────────────

    TimeSlot:
      type: object
      required: [id, date, startTime, endTime, isBooked, createdAt]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
        label: { type: ["string", "null"] }
        isBooked: { type: boolean }
        createdAt: { type: string, format: date-time }

    TimeSlotInput:
      type: object
      required: [date, startTime, endTime]
      properties:
        date: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
        label: { type: string }

    TimeSlotPatch:
      type: object
      properties:
        date: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
        label: { type: ["string", "null"] }
        isBooked: { type: boolean }

    # ── Booking schemas ───────────────────────────────────────────────────────

    Booking:
      type: object
      required: [id, name, email, bookingType, createdAt]
      properties:
        id: { type: integer }
        timeslotId: { type: ["integer", "null"] }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        bookingType: { type: string, enum: [slot, direct] }
        createdAt: { type: string, format: date-time }

    BookingInput:
      type: object
      required: [name, email, bookingType]
      properties:
        timeslotId: { type: integer }
        name: { type: string, minLength: 1 }
        email: { type: string }
        phone: { type: string }
        message: { type: string }
        bookingType: { type: string, enum: [slot, direct] }

    # ── Admin schemas ─────────────────────────────────────────────────────────

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password: { type: string }

    AdminToken:
      type: object
      required: [token]
      properties:
        token: { type: string }

    AdminStats:
      type: object
      required: [totalRecipes, publishedRecipes, totalBlogs, publishedBlogs, totalTimeslots, availableTimeslots, totalBookings, slotBookings, directContacts]
      properties:
        totalRecipes: { type: integer }
        publishedRecipes: { type: integer }
        totalBlogs: { type: integer }
        publishedBlogs: { type: integer }
        totalTimeslots: { type: integer }
        availableTimeslots: { type: integer }
        totalBookings: { type: integer }
        slotBookings: { type: integer }
        directContacts: { type: integer }
